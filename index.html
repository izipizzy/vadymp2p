<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Переход в Telegram...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Facebook Pixel Code -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', '1898688047662876');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1898688047662876&ev=PageView&noscript=1"/>
  </noscript>
  <!-- End Facebook Pixel Code -->

  <style>
    body {
      background-color: #0e1621;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #0088cc;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s;
    }
    .btn:hover {
      background-color: #00aaff;
    }
  </style>
</head>
<body>
  <h2>Переход в Telegram...</h2>
  <p>Если не произошло автоматически — нажми кнопку ниже 👇</p>

  <a href="https://t.me/+Ww5yej-P2lYwMmNi" id="join-btn" class="btn" target="_blank">
    Join Channel
  </a>

  <script>
    // Проверяем, что fbq загружен
    function fbReady(callback) {
      if (typeof fbq === 'function') {
        callback();
      } else {
        setTimeout(function() { fbReady(callback); }, 100);
      }
    }

    // Отслеживаем клик
    document.getElementById('join-btn').addEventListener('click', function(e) {
      e.preventDefault();
      fbReady(function() {
        fbq('track', 'Lead');
        console.log("Событие Lead отправлено в Facebook Pixel ✅");
      });

      // ждём 1 секунду перед редиректом
      setTimeout(function() {
        window.open("https://t.me/+Ww5yej-P2lYwMmNi", "_blank");
      }, 1000);
    });

    // Автоматический редирект через 3 сек. (если юзер не нажал)
    setTimeout(function() {
      fbq('trackCustom', 'AutoRedirect');
      window.location.href = "https://t.me/+Ww5yej-P2lYwMmNi";
    }, 3000);
  </script>
</body>
</html>

    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',

  <noscript>

  <style>
    body {
      background-color: #0e1621;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      padding-top: 100px;
    }
    a {
      color: #58a6ff;
      text-decoration: none;

</head>
<body>
  <h2>Переход в Telegram...</h2>
  <p>
    Если не произошло автоматически — 
    <a href="https://t.me/+Ww5yej-P2lYwMmNi" id="join-btn" target="_blank">Join Channel</a>.
  </p>

  <script>
    // Функция отправки события и перехода в Telegram
    function redirectToTelegram() {
      fbq('track', 'Lead'); // событие конверсии
      setTimeout(function() {
        window.location.href = "https://t.me/+Ww5yej-P2lYwMmNi";
      }, 1500); // даем пикселю время отправить событие
    }

    // Клик по кнопке
    document.getElementById('join-btn').addEventListener('click', function(e) {
      e.preventDefault();
      redirectToTelegram();
    });

    // Автоматический переход через 3 секунды
    setTimeout(redirectToTelegram, 3000);
  </script>
</body>
